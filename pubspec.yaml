name: frases_diarias
description: "Frases Diárias — inspiração premium todos os dias."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
    # localização (base para 64 idiomas)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^4.0.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  share_plus: ^12.0.0
  in_app_review: ^2.0.10
  path_provider: ^2.1.4
  gal: ^2.3.0
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0
  google_mobile_ads: ^5.3.1
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Ícone do app (navy + sol dourado). Rodar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#001332"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/landscapes/
    - assets/frases/
    - assets/icon/
